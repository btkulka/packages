    <g fill="url(#face)"><rect x="68" y="110" width="12" height="36" rx="6"/><rect x="86" y="93" width="12" height="70" rx="6"/><rect x="104" y="72" width="12" height="112" rx="6"/><rect x="122" y="86" width="12" height="84" rx="6"/><rect x="140" y="64" width="12" height="128" rx="6"/><rect x="158" y="95" width="12" height="66" rx="6"/><rect x="176" y="108" width="12" height="40" rx="6"/></g>
    
