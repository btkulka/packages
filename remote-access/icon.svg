<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>remote-access: who may sign in to a remote, and what each person may open</title>
  <defs>
    <clipPath id="sq"><rect width="256" height="256" rx="57"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d22"/><stop offset="1" stop-color="#040405"/>
    </linearGradient>
    <radialGradient id="halo" cx="128" cy="124" r="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cb8ff" stop-opacity="0.30"/><stop offset="1" stop-color="#2f6fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="128" cy="62" r="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcebff" stop-opacity="0.22"/><stop offset="1" stop-color="#7cb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="64" y1="56" x2="192" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcebff"/><stop offset="0.5" stop-color="#7cb8ff"/><stop offset="1" stop-color="#2f6fc4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/><stop offset="0.3" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="key">
      <circle cx="96" cy="120" r="42"/>
      <rect x="124" y="111" width="88" height="18" rx="9"/>
      <rect x="170" y="120" width="15" height="32" rx="6"/>
      <rect x="194" y="120" width="15" height="24" rx="6"/>
    </g>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#halo)"/>
    <ellipse cx="128" cy="196" rx="64" ry="10" fill="#000000" opacity="0.6" filter="url(#blur)"/>
    <!-- A key with a person in its bow: each guest gets a key of their own, opening only their apps. -->
    <g transform="translate(-4 -4)">
      <g transform="translate(0 8)" fill="#000000" opacity="0.45"><use href="#key"/></g>
      <g fill="url(#face)"><use href="#key"/></g>
      <!-- The person, cut from the bow. -->
      <g fill="#163a6b" fill-opacity="0.6"><circle cx="96" cy="106" r="11"/><path d="M74 142a22 20 0 0 1 44 0z"/></g>
    </g>
    <rect width="256" height="256" fill="url(#pool)"/>
    <rect x="0.5" y="0.5" width="255" height="255" rx="56.5" fill="none" stroke="url(#edge)" stroke-width="1"/>
  </g>
</svg>
