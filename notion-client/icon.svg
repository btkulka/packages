<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>notion-client</title>
  <defs>
    <clipPath id="sq"><rect width="256" height="256" rx="57"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d22"/><stop offset="1" stop-color="#040405"/>
    </linearGradient>
    <radialGradient id="halo" cx="128" cy="124" r="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62d9a0" stop-opacity="0.30"/><stop offset="1" stop-color="#1f8a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="128" cy="62" r="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6f6e7" stop-opacity="0.22"/><stop offset="1" stop-color="#62d9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="64" y1="56" x2="192" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6f6e7"/><stop offset="0.5" stop-color="#62d9a0"/><stop offset="1" stop-color="#1f8a5c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/><stop offset="0.3" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#halo)"/>
    <ellipse cx="128" cy="214" rx="64" ry="10" fill="#000000" opacity="0.6" filter="url(#blur)"/>
    <!-- A page, its corner folded: what the client reads. The sheet casts the same shadow the monogram icons do. -->
    <path d="M86 60h58l30 30v104a8 8 0 0 1-8 8H86a8 8 0 0 1-8-8V68a8 8 0 0 1 8-8z" transform="translate(0 8)" fill="#000000" opacity="0.45"/>
    <path d="M86 60h58l30 30v104a8 8 0 0 1-8 8H86a8 8 0 0 1-8-8V68a8 8 0 0 1 8-8z" fill="url(#face)"/>
    <path d="M144 60v22a8 8 0 0 0 8 8h22z" fill="#1f8a5c"/>
    <!-- Lines of text, cut from the sheet; the first is the title. -->
    <g fill="#0b2e1f" opacity="0.6">
      <rect x="98" y="104" width="40" height="10" rx="5"/>
      <rect x="98" y="126" width="60" height="8" rx="4"/>
      <rect x="98" y="144" width="60" height="8" rx="4"/>
      <rect x="98" y="162" width="42" height="8" rx="4"/>
    </g>
    <rect width="256" height="256" fill="url(#pool)"/>
    <rect x="0.5" y="0.5" width="255" height="255" rx="56.5" fill="none" stroke="url(#edge)" stroke-width="1"/>
  </g>
</svg>
